[package]
name = "webarkitlib-rs"
version.workspace = true
authors.workspace = true
edition.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme.workspace = true
include = [
    "src/**/*",
    "examples/**/*.rs",
    "build.rs",
    "Cargo.toml",
    "assets/**/*",
    # Vendored WebARKitLib C++ sources (via git submodule). See
    # docs/design/issue-72-ffi-backend-vendoring.md.
    # Only the subtrees build.rs actually compiles or includes — we
    # intentionally exclude Eigen's test/, bench/, and doc/ directories.
    "third_party/WebARKitLib/lib/SRC/KPM/FreakMatcher/facade/**/*",
    "third_party/WebARKitLib/lib/SRC/KPM/FreakMatcher/detectors/**/*",
    "third_party/WebARKitLib/lib/SRC/KPM/FreakMatcher/matchers/**/*",
    "third_party/WebARKitLib/lib/SRC/KPM/FreakMatcher/framework/**/*",
    "third_party/WebARKitLib/lib/SRC/KPM/FreakMatcher/homography_estimation/**/*",
    "third_party/WebARKitLib/lib/SRC/KPM/FreakMatcher/math/**/*",
    "third_party/WebARKitLib/lib/SRC/KPM/FreakMatcher/utils/**/*",
    "third_party/WebARKitLib/lib/SRC/KPM/FreakMatcher/Eigen/**/*",
    "third_party/WebARKitLib/lib/SRC/KPM/FreakMatcher/unsupported/Eigen/**/*",
    "third_party/WebARKitLib/include/**/*",
    # Licenses required to ship alongside vendored code.
    "third_party/WebARKitLib/LICENSE*",
    "third_party/WebARKitLib/COPYING*",
    "third_party/WebARKitLib/lib/SRC/KPM/FreakMatcher/Eigen/COPYING*",
    "third_party/WebARKitLib/lib/SRC/KPM/FreakMatcher/unsupported/COPYING*",
    "third_party/WebARKitLib/lib/SRC/KPM/FreakMatcher/unsupported/README.txt",
]

[dependencies]
image = "0.25.0"
imageproc = "0.26.0"
byteorder = "1.5.0"
jpeg-decoder = "0.3"
log = "0.4.0"
purecv = "0.4.0"
rand = "0.9"
rayon = "1.12"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
env_logger = { version = "0.11", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_log = { version = "1", optional = true }

[build-dependencies]
cc = "1"
bindgen = "0.72.1"

[features]
# Default features intentionally empty (M9-3, #142): a plain `cargo build`
# uses the pure-Rust FreakMatcher and requires no C++ compiler. The C++
# FFI backend is opt-in via `--features ffi-backend` for validation /
# regression testing.
default = []
simd = ["simd-image", "simd-pattern", "simd-wasm32", "simd-x86-sse41", "simd-x86-avx2"]
simd-image = []
simd-pattern = []
simd-wasm32 = []
simd-x86-sse41 = []
simd-x86-avx2 = []
ffi-backend = []
# dual-mode validates pure-Rust implementations against the C++ baseline;
# requires ffi-backend so the C++ comparison functions are compiled in.
dual-mode = ["ffi-backend"]
# Pulls env_logger (desktop) or console_log (wasm) for the `ar_log_init_*` helpers.
log-helpers = ["dep:env_logger", "dep:console_log"]

[dev-dependencies]
chrono = "0.4"
env_logger = "0.11"
criterion = "0.5.1"
clap = { version = "4.5", features = ["derive"] }
tempfile = "3"
# Used by the absolute corner-error integration test (#166) to parse
# annotation JSONs and read/write the regression baseline.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[example]]
name = "simple"
required-features = ["log-helpers"]

[[example]]
name = "simple_nft"
required-features = ["log-helpers"]
# M9-2 #141: switched from CppFreakMatcher to RustFreakMatcher. The Rust
# backend builds on the default feature set, so no `required-features` is
# needed anymore.

[[example]]
name = "simple_nft_dual"
# M9-2 #157: diagnostic sibling of simple_nft, drives DualFreakMatcher to
# compare C++ vs pure-Rust FREAK backends on the same query.
# - dual-mode   -> DualFreakMatcher (transitively pulls ffi-backend)
# - log-helpers -> ar_log_init_default() so arlog_*! macros emit output
required-features = ["dual-mode", "log-helpers"]

[[example]]
name = "load_nft"
required-features = ["log-helpers"]

[[example]]
name = "nft_marker_gen"
# M9-3 #142: builds on the pure-Rust default and produces `.iset` + `.fset`.
# `ffi-backend` is optional and unlocks the `.fset3` (FREAK descriptors)
# step, which still calls `CppFreakMatcher` directly. Wiring `.fset3`
# generation to `RustFreakMatcher` is a planned follow-up.
required-features = ["log-helpers"]

[[example]]
name = "barcode"
required-features = ["log-helpers"]

[[example]]
name = "debug_labeling"
required-features = ["log-helpers"]

# Issue #103 diagnostic — see docs/issue-103-fix-plan.md
[[example]]
name = "dump_patt"
required-features = ["log-helpers"]

[[example]]
name = "diff_patt"
required-features = ["log-helpers"]

[[example]]
name = "generate_patt"
required-features = ["log-helpers"]

[[bench]]
name = "marker_bench"
harness = false

[[bench]]
name = "simd_bench"
harness = false
required-features = ["simd-x86-sse41"]

[[bench]]
name = "feature_map_bench"
harness = false
required-features = ["log-helpers"]
