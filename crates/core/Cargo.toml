[package]
name = "webarkitlib-rs"
version.workspace = true
authors.workspace = true
edition.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme.workspace = true

[dependencies]
image = "0.25.0"
imageproc = "0.26.0"
byteorder = "1.5.0"
jpeg-decoder = "0.3"
log = "0.4.0"
rand = "0.9"
rayon = "1.12"

[build-dependencies]
cc = "1"
bindgen = "0.72.1"

[features]
simd = ["simd-image", "simd-pattern", "simd-wasm32", "simd-x86-sse41", "simd-x86-avx2"]
simd-image = []
simd-pattern = []
simd-wasm32 = []
simd-x86-sse41 = []
simd-x86-avx2 = []
ffi-backend = []
dual-mode = []

[dev-dependencies]
chrono = "0.4"
env_logger = "0.11"
criterion = "0.5.1"
clap = { version = "4.5", features = ["derive"] }
tempfile = "3"

[[example]]
name = "simple_nft"
required-features = ["ffi-backend"]

[[bench]]
name = "marker_bench"
harness = false

[[bench]]
name = "simd_bench"
harness = false

[[bench]]
name = "feature_map_bench"
harness = false
