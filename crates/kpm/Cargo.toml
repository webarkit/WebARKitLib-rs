[package]
name = "webarkitlib-kpm"
version.workspace = true
authors.workspace = true
edition.workspace = true
description = "KPM/NFT tracking layer for WebARKitLib-rs (FreakMatcher FFI bridge)"
license.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
webarkitlib-rs = { path = "../core" }

[build-dependencies]
cc = "1"
bindgen = "0.69"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

[features]
default = ["ffi-backend"]
ffi-backend = []
dual-mode = []
