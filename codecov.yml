# Codecov configuration for WebARKitLib-rs.
#
# Coverage scope: the pure-Rust library (`crates/core/src/`). Examples,
# benches, and integration tests are NOT instrumented by the coverage
# runner (tarpaulin uses `--exclude-files "**/tests/*"` in
# .github/workflows/coverage.yml; examples/benches are excluded by
# convention — they exist to demonstrate usage and measure performance,
# not to be exercised for line coverage).
#
# The `ignore` list below mirrors tarpaulin's exclusions on the codecov
# side so PRs that happen to land entirely in uninstrumented code don't
# fail `codecov/patch` at 0% diff hit.
#
# Surfaced during #180 PR 4.5: a cleanup PR touching examples/, benches/,
# and tests/ failed codecov/patch even though the library was unchanged.

coverage:
  status:
    project:
      default:
        target: auto
        threshold: 1%
    patch:
      default:
        target: auto
        threshold: 1%

ignore:
  - "crates/core/examples/**"
  - "crates/core/benches/**"
  - "crates/core/tests/**"
  - "crates/wasm/**"
  - "benchmarks/**"
