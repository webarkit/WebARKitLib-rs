name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  actions: read
  checks: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Wait for CI Benchmarks
        uses: lewagon/wait-on-check-action@v1.3.4
        with:
          ref: ${{ github.ref }}
          check-name: 'benchmarks'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 30

      - name: Download benchmark reports
        uses: dawidd6/action-download-artifact@v8
        with:
          workflow: ci.yml
          commit: ${{ github.sha }}
          name: benchmark-reports
          path: target/criterion

      - name: Package Reports
        run: |
          tar -czvf performance-reports.tar.gz target/criterion
          
      - name: Extract Changelog
        id: extract_changelog
        run: |
          VERSION="${{ github.ref_name }}"
          V_NUMBER="${VERSION#v}"
          echo "Extracting notes for version $V_NUMBER"
          awk -v ver="$V_NUMBER" '$0 ~ "## \\[" ver "\\]" {p=1; next} p && /^## \[/{p=0} p' CHANGELOG.md > release_notes.md

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            performance-reports.tar.gz
            target/criterion/c_benchmark.log
          body_path: release_notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-crates:
    needs: [release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Verify vendored sources
        run: |
          ls crates/core/third_party/WebARKitLib/lib/SRC/KPM/FreakMatcher/
      - name: Publish to Crates.io
        run: cargo publish --token ${{ secrets.CRATES_TOKEN }} -p webarkitlib-rs

  publish-npm:
    needs: [release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - name: Build and Publish to NPM
        run: |
          npm run build:wasm
          cd crates/wasm/pkg
          npm config set //registry.npmjs.org/:_authToken ${{ secrets.NPM_TOKEN }}
          npm publish --access public
