name: Rust CI

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy
        
    - name: Rust Cache
      uses: Swatinem/rust-cache@v2

    - name: Run cargo check
      run: cargo check --workspace

    - name: Run cargo test
      run: cargo test --workspace

  wasm-build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: wasm32-unknown-unknown

    - name: Install wasm-pack
      run: |
        curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

    - name: Build WASM module (Dual Mode)
      working-directory: crates/wasm
      run: |
        chmod +x scripts/build-dual.sh
        ./scripts/build-dual.sh

    - name: Upload WASM Package
      uses: actions/upload-artifact@v4
      with:
        name: wasm-package
        path: crates/wasm/pkg

  native-example:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Run native simple example
      working-directory: crates/core
      run: cargo run --example simple

  benchmarks:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Generate hiro.raw for C benchmark
      working-directory: crates/core
      run: cargo run --example simple -- ../../benchmarks/data/camera_para.dat ../../benchmarks/data/patt.hiro ../../benchmarks/data/img.jpg

    - name: Run benchmarks
      run: |
        # Download and Build C benchmark
        cd benchmarks/c_benchmark
        python ../bootstrap.py --bootstrap-file libraries.json
        
        mkdir -p build && cd build
        cmake .. -DCMAKE_BUILD_TYPE=Release
        make
        cd ..
        
        # Run C benchmark for baseline
        mkdir -p ../../target/criterion
        ./build/c_benchmark ../data/camera_para.dat ../data/patt.hiro ../data/hiro.raw 429 317 > ../../target/criterion/c_benchmark.log
        
        # Run Rust benchmarks
        cd ../..
        cargo bench -p webarkitlib-rs --bench marker_bench
    - name: Upload benchmark reports
      uses: actions/upload-artifact@v4
      with:
        name: benchmark-reports
        path: target/criterion
